# optionnel version: "3.8"



networks:
  soc-frontend:
    driver: bridge
    name: soc-frontend

  soc-backend:
    driver: bridge
    name: soc-backend
    internal: true

volumes:
  wazuh-indexer-data:
  wazuh-manager-data:
  wazuh-manager-logs:
  grafana-data:
  thehive-data:
  cassandra-data:

services:

 
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.4
    container_name: wazuh-indexer
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      - INDEXER_USERNAME=${WAZUH_INDEXER_USER:-admin}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    networks:
      - soc-backend
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 1

 
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.4
    container_name: wazuh-manager
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    ports:
      - "1514:1514/udp"
      - "1515:1515/tcp"
      - "55000:55000/tcp"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=${WAZUH_INDEXER_USER:-admin}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - API_USERNAME=${WAZUH_API_USER:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-manager-logs:/var/ossec/logs
    networks:
      - soc-frontend
      - soc-backend
    healthcheck:
      test: ["CMD", "true"]
      interval: 10s
      timeout: 5s
      retries: 1

 
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.4
    container_name: wazuh-dashboard
    restart: unless-stopped
    depends_on:
      wazuh-manager:
        condition: service_healthy
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=${WAZUH_INDEXER_USER:-admin}
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh-manager
      - WAZUH_API_PORT=55000
      - API_USERNAME=${WAZUH_API_USER:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD}
      - SERVER_SSL_ENABLED=false
    networks:
      - soc-frontend
      - soc-backend        

  
  suricata:
    image: jasonish/suricata:7.0.14
    container_name: suricata
    restart: unless-stopped
    network_mode: host
    environment:
      - SURICATA_OPTIONS=-i ${SURICATA_INTERFACE:-eth0}
    volumes:
      - /etc/suricata:/etc/suricata
      - /var/log/suricata:/var/log/suricata
      - /var/lib/suricata:/var/lib/suricata

 
  grafana:
    image: grafana/grafana:12.3.6
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - soc-frontend

  cassandra:
    image: cassandra:4.1.9
    container_name: cassandra
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=thehive
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - soc-backend
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s


  thehive:
    image: strangebee/thehive:5.6
    container_name: thehive
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - TH_SECRET=${THEHIVE_SECRET}
      - TH_DB_PROVIDER=cassandra
      - TH_DB_CASSANDRA_HOST=cassandra
      - TH_DB_CASSANDRA_CLUSTER=thehive
      - TH_DB_CASSANDRA_KEYSPACE=thehive
     
      - TH_ADMIN_LOGIN=${THEHIVE_ADMIN_LOGIN:-admin@thehive.local}
      - TH_ADMIN_PASSWORD=${THEHIVE_ADMIN_PASSWORD:-secret}
    volumes:
      - thehive-data:/opt/thehive/data
    networks:
      - soc-frontend
      - soc-backend
