

networks:
  soc-frontend:
    driver: bridge
    name: soc-frontend

  soc-backend:
    driver: bridge
    name: soc-backend
    internal: true         

volumes:
  wazuh-data:
  wazuh-logs:
  grafana-data:
  thehive-data:
  cassandra-data:

services:

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.4
    container_name: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514/udp"     
      - "1515:1515/tcp"    
      - "55000:55000/tcp"   
    environment:
      - WAZUH_MANAGER_PASSWORD=${WAZUH_MANAGER_PASSWORD}
      - API_USERNAME=${WAZUH_API_USER}
      - API_PASSWORD=${WAZUH_MANAGER_PASSWORD}
      - INDEXER_URL=https://wazuh-manager:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
    volumes:
      - wazuh-data:/var/ossec/data
      - wazuh-logs:/var/ossec/logs
    networks:
      - soc-frontend
      - soc-backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:55000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.14.4
    container_name: wazuh-dashboard
    restart: unless-stopped
    ports:
      - "443:5601"
    environment:
      - WAZUH_API_URL=https://wazuh-manager
      - WAZUH_API_PORT=55000
      - API_USERNAME=${WAZUH_API_USER}
      - API_PASSWORD=${WAZUH_MANAGER_PASSWORD}
      - SERVER_SSL_ENABLED=false    
    depends_on:
      wazuh-manager:
        condition: service_healthy
    networks:
      - soc-frontend

  
  suricata:
    image: jasonish/suricata:7.0.14
    container_name: suricata
    restart: unless-stopped
    network_mode: host
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
    #   - SYS_NICE
    # networks:
    #   - soc-backend
    environment:
      - SURICATA_OPTIONS=-i ${SURICATA_INTERFACE:-eth0}
    volumes:
      - /etc/suricata:/etc/suricata
      - /var/log/suricata:/var/log/suricata
      - /var/lib/suricata:/var/lib/suricata

  
  grafana:
    image: grafana/grafana:12.3.6
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - soc-frontend

 
  cassandra:
    image: cassandra:4.1.9
    container_name: cassandra
    restart: unless-stopped
    environment:
      - CASSANDRA_CLUSTER_NAME=thehive
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - soc-backend
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  
  thehive:
    image: strangebee/thehive:5.6
    container_name: thehive
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - TH_SECRET=${THEHIVE_SECRET}
      - TH_DB_PROVIDER=cassandra
      - TH_DB_CASSANDRA_HOST=cassandra
      - TH_DB_CASSANDRA_CLUSTER=thehive
      - TH_DB_CASSANDRA_KEYSPACE=thehive
    volumes:
      - thehive-data:/opt/thehive/data
    depends_on:
      cassandra:
        condition: service_healthy
    networks:
      - soc-frontend
      - soc-backend
  
  dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: dvwa
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_SERVER=dvwa-db
      - DB_DATABASE=dvwa
      - DB_USERNAME=${DVWA_DB_USER}
      - DB_PASSWORD=${DVWA_DB_PASSWORD}
    networks:
      - soc-frontend